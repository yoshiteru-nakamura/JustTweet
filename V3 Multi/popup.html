<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 200px; padding: 10px; font-family: sans-serif; }
    h3 { margin-top: 0; font-size: 14px; }
    label { display: block; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
    button {
      width: 100%; padding: 8px; background: #4676d7; color: white;
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #1d49aa; }
  </style>
</head>
<body>
  <h3>Share to...</h3>
  <label><input type="checkbox" id="chk_x" checked> X (Twitter)</label>
  <label><input type="checkbox" id="chk_threads" checked> Threads</label>
  <label><input type="checkbox" id="chk_bsky" checked> Bluesky</label>
  <button id="btn_share">Share Now</button>

  <script src="popup.js"></script>
</body>
</html>
